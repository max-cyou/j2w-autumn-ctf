name: j2w-autumn-ctf

x-challenge-defaults: &challenge-defaults
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /run:rw,noexec,nosuid,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: ${SERVICE_MEMORY_LIMIT:-256m}
  cpus: ${SERVICE_CPU_LIMIT:-1.0}
  pids_limit: ${SERVICE_PIDS_LIMIT:-128}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - challenges

services:
  memo-drop:
    <<: *challenge-defaults
    profiles: [round-1, all]
    build:
      context: ../tasks/round-1/memo-drop/service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MEMO_DROP_PORT:-8101}:8000"

  telemetry-vault:
    <<: *challenge-defaults
    profiles: [round-1, all]
    build:
      context: ../tasks/round-1/telemetry-vault/service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TELEMETRY_VAULT_PORT:-8102}:8000"

  double-vision:
    <<: *challenge-defaults
    profiles: [round-2, all]
    build:
      context: ../tasks/round-2/double-vision/service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DOUBLE_VISION_PORT:-8201}:8000"

  receipt-printer:
    <<: *challenge-defaults
    profiles: [round-2, all]
    build:
      context: ../tasks/round-2/receipt-printer/service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RECEIPT_PRINTER_PORT:-8202}:8000"

  null-authority:
    <<: *challenge-defaults
    profiles: [round-3, all]
    build:
      context: ../tasks/round-3/null-authority/service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NULL_AUTHORITY_PORT:-8301}:8000"

  open-gallery:
    <<: *challenge-defaults
    profiles: [round-3, all]
    build:
      context: ../tasks/round-3/open-gallery/service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OPEN_GALLERY_PORT:-8302}:8000"

networks:
  challenges:
    driver: bridge
